# Tenxnet_recipe boundary segmentation, initialized from the 2-channel boundary DINO SSL encoder
# trained with the MATCHING tenxnet_recipe backbone (ssl_dino/configs/boundary_2ch_tenxnet_recipe_full.yaml).
# The DINO trunk param names equal this encoder's, so restore is a full load of model.encoder
# (loaded=ALL, missing=0, unexpected=0; DINOHead dropped) -- verified by ssl_dino/sanity_tenxnet_dino.py.
# Encoder is fine-tuned (UNFROZEN) end-to-end with FPN+head. The 2-ch SSL checkpoint is
# [boundary, DAPI] -> matches seg_channels exactly, so the stem conv transfer is an identity load.
encoder: tenxnet_recipe                 # v1 stem, SD 0.5, endpoints 1..5 (FPN min_level 1)
in_chans: 2
num_classes: 9

manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_train.csv
val_manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_val.csv
augment: true
seg_channels: [boundary, DAPI]          # large_cell_boundary image order: ch0=boundary, ch1=DAPI
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}

# --- SSL init from the 2-channel boundary DINO run (tenxnet_recipe backbone) ---
init: dino
dino_checkpoint: /mnt/home/ruizhi.yuan/ssl_dino/out_boundary_2ch_tenxnet_recipe_dino/checkpoint.pth
dino_which: teacher                     # EMA teacher trunk (smoother features)
ssl_channels: [boundary, DAPI]          # 2-ch SSL stem-conv order -> identity map to seg_channels (no slicing)
# NOTE: SSL used meanstd normalization; seg uses positive/p99 -> input-distribution shift at init that
#       end-to-end fine-tuning (weights + BN running stats) absorbs.

optimizer: adamw
lr: 0.001                               # base/decoder LR (FPN + head)
encoder_lr: 0.00005                      # lower LR for the DINO-pretrained encoder (fine-tune gently);
                                         # set == lr (or remove) to train the encoder at the base LR
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5
epochs: 100
# NOTE: tenxnet_recipe's stride-1 v1 stem + full-res FPN endpoint (min_level 1) use more activation
# memory than resnet18; start at 64 (cf. tenxnet_small_scratch ran 96 without the stem endpoint),
# raise if memory allows.
batch_size: 24                          # per-GPU
num_workers: 8
amp: true

out_dir: /mnt/home/ruizhi.yuan/pytorch_seg/runs/tenxnet_recipe_dino_boundary2ch
seed: 0
save_every: 10
log_every: 20
