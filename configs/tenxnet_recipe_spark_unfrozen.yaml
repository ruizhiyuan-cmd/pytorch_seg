# UNFROZEN (fine-tuned) SparK-pretrained tenxnet_recipe encoder -> P1-P5 FPN -> Ridgepath head.
# Load the on-domain SparK encoder and fine-tune it end-to-end: tiny encoder LR (adapt, don't wipe the
# SSL features) + normal decoder LR (FPN+head random). Pair with the frozen probe
# (tenxnet_recipe_spark_frozen.yaml) to see whether fine-tuning beats frozen transfer. Because the encoder
# is BatchNorm, training UNFROZEN also re-adapts its running stats to dense (unmasked) inputs.
encoder: tenxnet_recipe
encoder_norm: bn
in_chans: 2
num_classes: 9
model_kwargs: {}                       # RidgepathSegModel path; fpn/head defaults set by build_seg_model

manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_cell_tenxnet_train.csv    # 6076 labeled cell-boundary tiles (tenxnet split)
val_manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_cell_tenxnet_val.csv  # 658 labeled cell-boundary tiles
augment: true
seg_channels: [boundary, DAPI]
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}

# --- load pretrained SparK encoder, then fine-tune UNFROZEN ---
init: seg_encoder
seg_checkpoint: /mnt/home/ruizhi.yuan/pytorch_seg/cache/tenxnet_recipe_spark_seg_encoder.pth
freeze_encoder_epochs: 0            # unfrozen from step 1
freeze_encoder_eval: false          # encoder in TRAIN mode (BN running-stats update, stochastic-depth active)

optimizer: adamw
lr: 0.003                           # decoder (FPN + head, random-init)
encoder_lr: 0.0003                  # SparK encoder ~lr/10: on-domain SSL features adapt but aren't wiped
encoder_lr_follows_schedule: true   # encoder LR cosine-decays with the decoder factor
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5                    # protects the pretrained encoder from the random decoder's early gradient shock
epochs: 300
batch_size: 64
num_workers: 8
amp: true
amp_dtype: bf16                     # Ada GPU
grad_clip: null

out_dir: /mnt/home/ruizhi.yuan/pytorch_seg/runs/tenxnet_recipe_spark_unfrozen
seed: 0
save_every: 10
log_every: 20
