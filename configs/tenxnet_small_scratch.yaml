# Faithful tenxnet small-ResNet, trained from scratch (PyTorch-port baseline / sanity check).
# NOTE: architecture differs from ResNet18 -> do NOT read tenxnet_small-scratch vs ResNet18-DINO
# as pure SSL benefit. The fair SSL ablation is r18_scratch vs r18_dino.
encoder: tenxnet_small
in_chans: 2
num_classes: 9

manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_train.csv
val_manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_val.csv
augment: true
seg_channels: [boundary, DAPI]          # large_cell_boundary image order: ch0=boundary, ch1=DAPI
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}

init: scratch

optimizer: adamw
lr: 0.001
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5
epochs: 100
batch_size: 32
num_workers: 8
amp: true

out_dir: /mnt/home/ruizhi.yuan/pytorch_seg/runs/tenxnet_small_scratch
seed: 42
save_every: 10
log_every: 20
