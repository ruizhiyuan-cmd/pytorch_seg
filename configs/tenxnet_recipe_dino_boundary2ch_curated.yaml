# Tenxnet_recipe boundary segmentation, DINO-initialized, trained on the CURATED (labeled-tiles-only)
# manifest. Rationale: the full manifest is ~53% empty real-tissue tiles (whole tissues unlabeled),
# and tenxnet's ch9 weight is bounded [0.5,1.0] with background at 1.0 (does NOT downweight background),
# so the direction heads collapsed to the background class. Removing pure-background tiles restores a
# usable fg/bg balance (~41% foreground within labeled tiles) so the row/col heads can learn.
# Identical to tenxnet_recipe_dino_boundary2ch.yaml EXCEPT manifest/val_manifest + out_dir.
encoder: tenxnet_recipe                 # v1 stem, SD 0.5, endpoints 1..5 (FPN min_level 1)
in_chans: 2
num_classes: 9

manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_train_labeled.csv   # 325 labeled tiles
val_manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_val_labeled.csv  # 57 labeled tiles
augment: true
seg_channels: [boundary, DAPI]          # large_cell_boundary image order: ch0=boundary, ch1=DAPI
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}  # == test.yaml

# --- SSL init from the 2-channel boundary DINO run (tenxnet_recipe backbone) ---
init: dino
dino_checkpoint: /mnt/home/ruizhi.yuan/ssl_dino/out_boundary_2ch_tenxnet_recipe_dino/checkpoint.pth
dino_which: teacher                     # EMA teacher trunk (smoother features)
ssl_channels: [boundary, DAPI]          # 2-ch SSL stem-conv order -> identity map to seg_channels (no slicing)

optimizer: adamw
lr: 0.001                               # base/decoder LR (FPN + head, incl. the direction heads)
encoder_lr: 0.00005                     # gentle fine-tune of the DINO-pretrained encoder
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5
epochs: 100
batch_size: 8                          # per-GPU
num_workers: 8
amp: true

out_dir: /mnt/home/ruizhi.yuan/pytorch_seg/runs/tenxnet_recipe_dino_boundary2ch_curated
seed: 0
save_every: 10
log_every: 20
