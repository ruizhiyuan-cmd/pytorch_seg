# ResNet18 boundary segmentation, initialized from the 2-channel boundary DINO SSL encoder.
# Encoder is fine-tuned (UNFROZEN) end-to-end with FPN+head (restore only copies weights; the optimizer
# trains all params). The 2-ch SSL checkpoint is [boundary, DAPI] -> matches seg_channels exactly, so the
# conv1 transfer is an identity load (no channel slicing).
encoder: resnet18
in_chans: 2
num_classes: 9

manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_train.csv
val_manifest: /mnt/home/ruizhi.yuan/pytorch_seg/cache/manifest_val.csv
augment: true
seg_channels: [boundary, DAPI]          # large_cell_boundary image order: ch0=boundary, ch1=DAPI
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}

# --- SSL init from the 2-channel boundary DINO run ---
init: dino
dino_checkpoint: /mnt/home/ruizhi.yuan/ssl_dino/out_boundary_2ch_r18_dino/checkpoint.pth
dino_which: teacher                     # EMA teacher backbone (smoother features)
ssl_channels: [boundary, DAPI]          # 2-ch SSL conv1 order -> identity map to seg_channels (no slicing)
# NOTE: SSL used meanstd normalization; seg uses positive/p99 -> input-distribution shift at init that
#       end-to-end fine-tuning (weights + BN running stats) absorbs.

optimizer: adamw
lr: 0.001
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5
epochs: 100
batch_size: 64                            # per-GPU; 4 GPUs -> effective batch 32
num_workers: 8
amp: true

out_dir: /mnt/home/ruizhi.yuan/pytorch_seg/runs/r18_dino_boundary2ch
seed: 0
save_every: 10
log_every: 20
